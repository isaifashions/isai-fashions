<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isai Fashions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ISAI FASHIONS</h1>
</header>

<div class="product-page checkout-page">

    <div class="checkout-layout">
        <div class="checkout-main">
            <div class="checkout-product-card">
                <div class="product-image checkout-product-image">
                    <img id="product-image" src="" alt="Product">
                </div>

                <div class="checkout-product-copy">
                    <p class="checkout-breadcrumb">Home / Checkout</p>
                    <h2 id="product-name"></h2>
                    <h3 id="product-price"></h3>

                    <div class="attributes-row">
                        <div>
                            <span>Size</span>
                            <strong id="selected-size-label">M</strong>
                        </div>
                        <div>
                            <span>Qty</span>
                            <strong id="selected-quantity-label">1</strong>
                        </div>
                    </div>

                    <p class="checkout-description" id="product-description">
                        Loading product details...
                    </p>

                    <h4>Available Sizes</h4>
                    <div class="sizes" id="product-sizes"></div>
                </div>
            </div>
        </div>

        <aside class="checkout-summary-panel">
            <div class="order-summary-box">
                <h4>Order Summary</h4>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal-price">₹0</strong>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <strong id="shipping-price">₹0</strong>
                </div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <strong id="order-total">₹0</strong>
                </div>
            </div>

            <div class="checkout-card">
                <h4>Shipping Details</h4>
                <form id="checkout-form">
                    <div class="form-row">
                        <label for="customer-name">Full Name</label>
                        <input id="customer-name" type="text" placeholder="Enter your name" required>
                    </div>

                    <div class="form-row">
                        <label for="customer-phone">Phone Number</label>
                        <input id="customer-phone" type="tel" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-row">
                        <label for="customer-address">Delivery Address</label>
                        <textarea id="customer-address" rows="3" placeholder="Enter your complete address" required></textarea>
                    </div>

                    <div class="form-row">
                        <label for="customer-city">City</label>
                        <input id="customer-city" type="text" placeholder="Enter your city" required>
                    </div>

                    <div class="form-row">
                        <label for="customer-pincode">Pincode</label>
                        <input id="customer-pincode" type="text" inputmode="numeric" placeholder="Enter your pincode" required>
                    </div>

                    <div class="form-row quantity-row">
                        <label for="quantity">Quantity</label>
                        <input id="quantity" type="number" min="1" value="1" required>
                    </div>

                    <div class="form-row">
                        <label for="payment-method">Payment Method</label>
                        <select id="payment-method">
                            <option value="GPay (UPI)">GPay (UPI)</option>
                            <option value="Cash on Delivery (+₹100)">Cash on Delivery (+₹100)</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="customer-note">Order Notes</label>
                        <textarea id="customer-note" rows="2" placeholder="Any special instructions?"></textarea>
                    </div>

                    <button type="submit" class="order-btn">Place Order</button>
                </form>
            </div>
        </aside>
    </div>

</div>

<script src="product.js"></script>

</body>
</html>
