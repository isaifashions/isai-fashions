<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Isai Fashions</title>
  <style>
    :root {
      --bg: #f9f5f1;
      --panel: #ffffff;
      --gold: #b88327;
      --gold-dark: #8c651d;
      --text: #2d2a27;
      --muted: #66615c;
      --shadow: rgba(41, 27, 10, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #fffaf7 0%, #f4efe9 100%);
      color: var(--text);
    }

    .card {
      width: min(92vw, 620px);
      background: var(--panel);
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
      padding: 48px 36px 36px;
      text-align: center;
      border: 1px solid rgba(184, 131, 39, 0.12);
    }

    .code {
      font-size: clamp(4rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.08em;
      color: var(--gold);
      margin: 0 0 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--text);
    }

    p {
      margin: 0 auto 24px;
      max-width: 480px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      padding: 14px 26px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #d7b267 0%, var(--gold) 40%, var(--gold-dark) 100%);
      color: white;
      box-shadow: 0 12px 24px rgba(184, 131, 39, 0.2);
    }

    .btn-secondary {
      background: #f7f3ef;
      color: var(--text);
      border: 1px solid rgba(45, 42, 39, 0.08);
    }

    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card" role="alert" aria-live="polite">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>
      The page you were looking for does not exist or may have moved. Head back to the homepage to continue exploring Isai Fashions.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go to Homepage</a>
      <a class="btn btn-secondary" href="product.html">Browse Products</a>
    </div>
  </main>
</body>
</html>
