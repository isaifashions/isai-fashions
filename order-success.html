<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed | Isai Fashions</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #fffaf6 0%, #fffdfb 100%);
        }

        .success-page {
            max-width: 680px;
            width: min(90vw, 680px);
            background: #fff;
            border: 1px solid #f0e1bb;
            border-radius: 24px;
            box-shadow: 0 18px 42px rgba(26, 16, 8, 0.08);
            padding: 42px 30px;
            text-align: center;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #eaf8ee;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 18px;
        }

        .success-page h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #1d1a17;
            margin-bottom: 12px;
            font-family: 'Cormorant Garamond', serif;
        }

        .success-page p {
            color: #4f4b47;
            font-size: 1.02rem;
            margin: 10px 0;
        }

        .success-meta {
            margin-top: 18px;
            background: #fffaf2;
            border: 1px solid #f0e2bb;
            border-radius: 16px;
            padding: 16px 18px;
            text-align: left;
        }

        .success-meta strong {
            display: inline-block;
            min-width: 110px;
        }

        .success-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .success-actions a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="success-icon">✓</div>
        <h1>Order Placed Successfully</h1>
        <p>Your order has been received and saved in our system.</p>

        <div class="success-meta">
            <p><strong>Order ID:</strong> <span id="success-order-id">-</span></p>
            <p><strong>Payment:</strong> <span id="success-payment">-</span></p>
        </div>

        <div class="success-actions">
            <a href="index.html" class="btn">Continue Shopping</a>
            <a href="orders-dashboard.html" class="btn">Open Dashboard</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        const payment = params.get('payment');

        document.getElementById('success-order-id').textContent = orderId || 'N/A';
        document.getElementById('success-payment').textContent = payment || 'N/A';
    </script>
</body>
</html>
